<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Tool</title>
    <style>
        /* CSS Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
        }
        /* Main Button Style (Load/Generate Now) - Unified Look */
        #loadButton, #generateButton {
            width: 100%;
            padding: 12px 12px; 
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 10px;
            font-size: 1.1em; 
            font-weight: bold;
            box-sizing: border-box; 
        }
        
        /* Style for 'Load New Data' button in summary section (using same look) */
        .summary-button { 
            width: 100%; 
            padding: 12px 12px; 
            background-color: #007bff; /* Same color as Load/Generate */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 15px; 
            font-size: 1.1em; 
            font-weight: bold;
            box-sizing: border-box;
        }

        #loadButton:hover, #generateButton:hover, .summary-button:hover {
            background-color: #0056b3;
        }
        
        /* Output Box - shows current item or status */
        #output {
            margin-top: 15px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 4px;
            background-color: #e9ecef;
            min-height: 80px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        /* Status box for counts and remaining message - 100% width */
        #statusBox {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #007bff;
            background-color: #e6f0ff;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            color: #007bff;
            line-height: 1.5;
            display: none; 
            width: 100%; 
            box-sizing: border-box; 
        }
        /* Account Type Box Wrapper */
        .account-type-wrapper {
            width: 100%; /* Full width */
            padding: 10px;
            background-color: #ffc107; /* Highlight color for visibility */
            border-radius: 4px 4px 0 0; /* Rounded top corners */
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            box-sizing: border-box;
        }
        /* Modified .user-item style to remove top padding for wrapper alignment */
        .user-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 10px 0; /* Removed top padding */
            width: 100%; 
        }
        .item-content {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px; /* Added spacing after type indicator */
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: bold;
            word-break: break-all;
            text-align: center;
            width: 100%;
        }
        .serial-number {
            margin-right: 10px;
            color: #6c757d;
        }
        .copy-btn {
            background: #28a745;
            color: white;
            padding: 12px 10px; 
            margin: 5px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 130px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .summary {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #007bff;
            background-color: #e6f0ff;
            border-radius: 4px;
            text-align: left;
            width: 100%; 
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <textarea id="dataInput" placeholder="Paste usernames/emails here (separated by line break or space)"></textarea>
    
    <button id="loadButton" onclick="loadData()">Load Data</button>
    
    <div id="generationControls" style="display: none;">
        <button id="generateButton" onclick="generateNextItem()">Generate Now</button> 
    </div>

    <div id="output">
        </div>

    <div id="statusBox">
        <span id="countDisplay"></span>
    </div>
</div>

<script>
const dataInput = document.getElementById('dataInput');
const loadButton = document.getElementById('loadButton');
const generateButton = document.getElementById('generateButton');
const generationControls = document.getElementById('generationControls');
const outputDiv = document.getElementById('output');
const countDisplay = document.getElementById('countDisplay');
const statusBox = document.getElementById('statusBox'); 

const FIXED_PASSWORD = "RAKIB@1"; 
let usernameList = [];
let currentIndex = 0;
let totalCount = 0;
let totalGmailCount = 0; 
let totalUserCount = 0;

// Function to update the count display (Single Line Format)
function updateCountDisplay(isInitialLoad = false) {
    const itemsCopied = currentIndex > 0 ? currentIndex - 1 : 0;
    const itemsRemaining = totalCount - itemsCopied;

    if (totalCount > 0) {
        // Count format: Username: X, Gmail: Y | Total Items: Z
        let countHtml = `Username: ${totalUserCount}, Gmail: ${totalGmailCount} | Total Items: ${totalCount}`;
        
        if (isInitialLoad) {
            statusBox.innerHTML = countHtml;
        }

        if (itemsRemaining > 0 && generateButton.style.display === 'block') {
             // Show remaining message in the status box
             statusBox.innerHTML = `${countHtml} <br><span style="color: green; font-weight: bold;">Ready to copy: ${itemsRemaining} items remaining.</span>`;
             outputDiv.innerHTML = '<p style="color: green; text-align: center;">Data loaded. Click "Generate Now" to start.</p>';

        } else if (currentIndex > 0 && generateButton.style.display === 'none') {
            // When an item is actively displayed/copied, show simple count
             statusBox.innerHTML = countHtml;
        }
    }
}

// Step 1: Load all data at once (Now handles space and newline separation, and duplicate removal)
function loadData() {
    const rawData = dataInput.value.trim();
    if (!rawData) {
        outputDiv.innerHTML = '<p style="color: red; text-align: center;">Please input usernames/emails.</p>';
        statusBox.style.display = 'none';
        return;
    }

    // NEW: Replace all newlines with spaces, then split by any sequence of one or more spaces
    // This handles both newline-separated and space-separated inputs on the same line.
    const rawList = rawData
        .replace(/\n/g, ' ') // Replace newlines with single space
        .split(/\s+/)        // Split by one or more spaces
        .map(line => line.trim())
        .filter(line => line !== '');

    // Duplicate Removal Logic
    const uniqueList = Array.from(new Set(rawList)); 

    const duplicatesRemoved = rawList.length - uniqueList.length;
    
    usernameList = uniqueList;
    totalCount = usernameList.length;
    currentIndex = 0;
    totalGmailCount = 0; 
    totalUserCount = 0; 

    if (totalCount === 0) {
        outputDiv.innerHTML = '<p style="color: orange; text-align: center;">No valid usernames/emails found.</p>';
        statusBox.style.display = 'none';
        return;
    }
    
    // UI Change
    dataInput.style.display = 'none';
    loadButton.style.display = 'none';
    generationControls.style.display = 'block';
    statusBox.style.display = 'block';
    
    // Initial categorization and count
    usernameList.forEach(accountText => {
        if (accountText.includes('@')) {
            totalGmailCount++;
        } else {
            totalUserCount++;
        }
    });

    // Initial count display
    updateCountDisplay(true);
    
    let loadMessage = `<p style="color: green; text-align: center;">Data loaded successfully.`;
    if (duplicatesRemoved > 0) {
        loadMessage += `<br><span style="color: orange;">${duplicatesRemoved} duplicate(s) removed.</span>`;
    }
    loadMessage += `</p>`;
    
    outputDiv.innerHTML = loadMessage;
    
    // Ensure Generate Now button is visible on first load
    generateButton.style.display = 'block'; 
}

// Step 2: Generate one item at a time
function generateNextItem() {
    if (currentIndex >= totalCount) {
        resetToLoadPage(); 
        return;
    }

    const accountText = usernameList[currentIndex];
    const itemId = currentIndex + 1;
    
    // Hide Generate Now Button
    generateButton.style.display = 'none'; 
    
    // Reset state for the new item
    window.itemStates = {};
    window.itemStates[itemId] = {
        isTextCopied: false,
        isPasswordCopied: false
    };

    let htmlContent = '';
    
    const isEmail = accountText.includes('@');
    const accountTypeLabel = isEmail ? 'GMAIL ACCOUNT' : 'USERNAME ACCOUNT'; 
    
    // Split the display into the Account Type box and the item content box
    if (isEmail) {
        htmlContent = `
            <div class="account-type-wrapper">${accountTypeLabel}</div>
            <div class="user-item" id="item-${itemId}" style="padding: 15px 0 10px;">
                <div class="item-content">
                    <span class="serial-number">${itemId}.</span> 
                    <span>${accountText}</span> 
                </div>
                <div>
                    <button class="copy-btn gmail" data-type="email" data-id="${itemId}" data-value="${accountText}" onclick="copyText(this)">Gmail</button>
                </div>
            </div>
        `;
        
    } else {
        htmlContent = `
            <div class="account-type-wrapper">${accountTypeLabel}</div>
            <div class="user-item" id="item-${itemId}" style="padding: 15px 0 10px;">
                <div class="item-content">
                    <span class="serial-number">${itemId}.</span> 
                    <span>${accountText}</span> 
                </div>
                <div>
                    <button class="copy-btn" data-type="text" data-id="${itemId}" data-value="${accountText}" onclick="copyText(this)">Username</button>
                    <button class="copy-btn" data-type="password" data-id="${itemId}" data-value="${FIXED_PASSWORD}" onclick="copyText(this)">Password</button>
                </div>
            </div>
        `;
    }
    
    // Temporarily remove the default outputDiv padding so the new wrapper aligns to the edge
    outputDiv.style.padding = '0';
    outputDiv.innerHTML = htmlContent;
    
    // Update count display
    updateCountDisplay();

    currentIndex++;
}


// Copy Function 
async function copyText(button) {
    const textToCopy = button.getAttribute('data-value');
    const type = button.getAttribute('data-type');
    const itemId = button.getAttribute('data-id');
    
    try {
        await navigator.clipboard.writeText(textToCopy);
        
        button.classList.add('copied');
        button.innerText = '✓ Done';
        
        if (type === 'email') {
             window.itemStates[itemId].isTextCopied = true; 
             window.itemStates[itemId].isPasswordCopied = true; 
        } else if (type === 'text') {
            window.itemStates[itemId].isTextCopied = true;
        } else if (type === 'password') {
            window.itemStates[itemId].isPasswordCopied = true;
        }
        
        checkAndRemove(itemId);

    } catch (err) {
        console.error('Failed to copy:', err);
        button.innerText = 'Fail';
        setTimeout(() => {
            button.innerText = (type === 'email' ? 'Gmail' : (type === 'text' ? 'Username' : 'Password'));
            button.classList.remove('copied');
        }, 1000); 
    }
}

// Removal Function 
function checkAndRemove(itemId) {
    // We need to remove both the wrapper and the item div
    const itemDiv = document.getElementById(`item-${itemId}`);
    const wrapperDiv = itemDiv ? itemDiv.previousElementSibling : null;
    const state = window.itemStates[itemId];

    if (state && state.isTextCopied && state.isPasswordCopied) {
        
        setTimeout(() => {
            if(wrapperDiv) wrapperDiv.style.opacity = '0';
            if(itemDiv) itemDiv.style.opacity = '0';
            
            setTimeout(() => {
                 if(wrapperDiv) wrapperDiv.remove();
                 if(itemDiv) itemDiv.remove();
                 
                 // Restore outputDiv padding before showing the next message/button
                 outputDiv.style.padding = '15px'; 
                 
                 // Check if the process is finished or ready for the next item
                 if (currentIndex < totalCount) {
                     generateButton.style.display = 'block'; 
                     updateCountDisplay(); 
                 } else {
                     // Process is complete: Show count and reset
                     showCompletionSummary();
                 }
            }, 500); 
        }, 500); 
    }
}

// Function to show summary and reset the page
function showCompletionSummary() {
    const summaryHTML = `
        <p style="color: blue; font-weight: bold; text-align: center; margin-bottom: 10px;">Process Complete! ✅</p>
        <div class="summary">
            <strong>Total Accounts:</strong> ${totalCount}<br>
            <strong>Usernames Copied:</strong> ${totalUserCount}<br>
            <strong>Gmail Accounts Copied:</strong> ${totalGmailCount}
        </div>
        <button onclick="resetToLoadPage()" class="summary-button">Load New Data</button>
    `;
    
    // Restore outputDiv padding
    outputDiv.style.padding = '15px'; 
    
    // We are putting the final summary INSIDE the outputDiv
    outputDiv.innerHTML = summaryHTML;
    generationControls.style.display = 'none'; 
    statusBox.style.display = 'none'; // Hide status box on completion
}

// Function to reset the UI to the initial loading state
function resetToLoadPage() {
    // Reset variables
    usernameList = [];
    currentIndex = 0;
    totalCount = 0;
    totalGmailCount = 0;
    totalUserCount = 0;
    
    // Reset UI elements
    dataInput.value = '';
    dataInput.style.display = 'block';
    loadButton.style.display = 'block';
    generationControls.style.display = 'none';
    outputDiv.innerHTML = '';
    outputDiv.style.padding = '15px'; // Ensure padding is reset
    statusBox.innerHTML = '';
    statusBox.style.display = 'none';
    
    // Reset Generate Now button state
    generateButton.style.display = 'none';
}
</script>

</body>
</html>
